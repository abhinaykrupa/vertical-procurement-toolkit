<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f1419"/>
      <stop offset="100%" stop-color="#101820"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="warn" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="danger" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#fca5a5"/>
    </linearGradient>
    <linearGradient id="success" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="520" fill="url(#bg)"/>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" fill="#e6edf3" font-size="26" font-weight="600">Vertical Procurement Toolkit</text>
  <text x="600" y="80" text-anchor="middle" fill="#94a3b8" font-size="14">supplier-invoice savings analysis · open source · MIT · works for any fragmented-supplier vertical</text>

  <!-- Stage labels above -->
  <text x="170" y="125" text-anchor="middle" fill="#64748b" font-size="11" letter-spacing="2">INPUT</text>
  <text x="430" y="125" text-anchor="middle" fill="#64748b" font-size="11" letter-spacing="2">3-STAGE MATCHER</text>
  <text x="780" y="125" text-anchor="middle" fill="#64748b" font-size="11" letter-spacing="2">CROSS-CUT</text>
  <text x="1030" y="125" text-anchor="middle" fill="#64748b" font-size="11" letter-spacing="2">ROUTER</text>

  <!-- Input column -->
  <g>
    <rect x="60" y="150" width="220" height="60" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="170" y="178" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">Supplier file</text>
    <text x="170" y="196" text-anchor="middle" fill="#94a3b8" font-size="11">Benco · Vetcove · Sysco · any CSV</text>

    <rect x="60" y="225" width="220" height="60" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="170" y="253" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">Auto-detect supplier</text>
    <text x="170" y="271" text-anchor="middle" fill="#94a3b8" font-size="11">filename · header content</text>

    <rect x="60" y="300" width="220" height="60" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="170" y="328" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">Per-supplier adapter</text>
    <text x="170" y="346" text-anchor="middle" fill="#94a3b8" font-size="11">parse → canonical schema</text>
  </g>

  <!-- 3-stage matcher column -->
  <g>
    <rect x="320" y="150" width="220" height="60" rx="8" fill="#0f3a3a" stroke="url(#accent)" stroke-width="1.5"/>
    <text x="430" y="174" text-anchor="middle" fill="#5eead4" font-size="13" font-weight="600">Stage 1 · Deterministic</text>
    <text x="430" y="194" text-anchor="middle" fill="#94a3b8" font-size="11">exact SKU / mfg SKU · 0 LLM cost</text>

    <rect x="320" y="225" width="220" height="60" rx="8" fill="#0f3a3a" stroke="url(#accent)" stroke-width="1.5"/>
    <text x="430" y="249" text-anchor="middle" fill="#5eead4" font-size="13" font-weight="600">Stage 2 · Semantic retrieval</text>
    <text x="430" y="269" text-anchor="middle" fill="#94a3b8" font-size="11">fuzzy + token overlap · top-K</text>

    <rect x="320" y="300" width="220" height="60" rx="8" fill="#0f3a3a" stroke="url(#accent)" stroke-width="1.5"/>
    <text x="430" y="324" text-anchor="middle" fill="#5eead4" font-size="13" font-weight="600">Stage 3 · LLM judge</text>
    <text x="430" y="344" text-anchor="middle" fill="#94a3b8" font-size="11">Claude Haiku / GPT-4o-mini · mock fallback</text>
  </g>

  <!-- UOM cross-cut -->
  <g>
    <rect x="660" y="225" width="240" height="60" rx="8" fill="#3a2a0f" stroke="url(#warn)" stroke-width="1.5"/>
    <text x="780" y="249" text-anchor="middle" fill="#fde68a" font-size="13" font-weight="600">UOM / pack-size normalizer</text>
    <text x="780" y="269" text-anchor="middle" fill="#94a3b8" font-size="11">"box vs case" detection · regex + aliases</text>
  </g>

  <!-- Router & outputs -->
  <g>
    <rect x="940" y="150" width="200" height="55" rx="8" fill="#0f3a1f" stroke="url(#success)" stroke-width="1.5"/>
    <text x="1040" y="172" text-anchor="middle" fill="#4ade80" font-size="13" font-weight="600">AUTO-ACCEPT</text>
    <text x="1040" y="190" text-anchor="middle" fill="#94a3b8" font-size="11">≥ 0.85 confidence</text>

    <rect x="940" y="215" width="200" height="55" rx="8" fill="#3a2a0f" stroke="url(#warn)" stroke-width="1.5"/>
    <text x="1040" y="237" text-anchor="middle" fill="#fde68a" font-size="13" font-weight="600">REVIEW QUEUE</text>
    <text x="1040" y="255" text-anchor="middle" fill="#94a3b8" font-size="11">0.60–0.85 · human approves</text>

    <rect x="940" y="280" width="200" height="55" rx="8" fill="#3a1a1a" stroke="url(#danger)" stroke-width="1.5"/>
    <text x="1040" y="302" text-anchor="middle" fill="#fca5a5" font-size="13" font-weight="600">FORCE REVIEW</text>
    <text x="1040" y="320" text-anchor="middle" fill="#94a3b8" font-size="11">UOM mismatch · regardless of score</text>

    <rect x="940" y="345" width="200" height="55" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="1040" y="367" text-anchor="middle" fill="#cbd5e1" font-size="13" font-weight="600">NO-MATCH</text>
    <text x="1040" y="385" text-anchor="middle" fill="#94a3b8" font-size="11">&lt; 0.60 · catalog gap signal</text>
  </g>

  <!-- Arrows -->
  <g stroke="#475569" stroke-width="1.5" fill="none">
    <!-- Input chain -->
    <path d="M170 210 L170 225" marker-end="url(#arrow)"/>
    <path d="M170 285 L170 300" marker-end="url(#arrow)"/>
    <!-- Adapter → Stage 1 -->
    <path d="M280 330 Q 300 330, 300 180 L 320 180" marker-end="url(#arrow)"/>
    <!-- Stage chain -->
    <path d="M430 210 L 430 225" marker-end="url(#arrow)"/>
    <path d="M430 285 L 430 300" marker-end="url(#arrow)"/>
    <!-- UOM in/out -->
    <path d="M540 330 Q 600 330, 600 255 L 660 255" marker-end="url(#arrow)"/>
    <path d="M540 180 Q 620 180, 620 240 L 660 240" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <!-- To router -->
    <path d="M900 255 L 940 255" marker-end="url(#arrow)"/>
    <path d="M540 180 L 940 180" marker-end="url(#arrow)"/>
    <path d="M540 330 L 940 310" marker-end="url(#arrow)"/>
    <path d="M540 330 L 940 370" marker-end="url(#arrow)"/>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Bottom: example numbers -->
  <g>
    <rect x="60" y="430" width="1080" height="60" rx="8" fill="#0d1117" stroke="#1e293b"/>
    <text x="80" y="455" fill="#94a3b8" font-size="12">Vet example (CLI):</text>
    <text x="80" y="475" fill="#e6edf3" font-size="12" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">python -m vpt.cli analyze -s sample_clinic_vetcove.csv -c vet_catalog.csv</text>
    <text x="700" y="455" fill="#94a3b8" font-size="12">Result:</text>
    <text x="700" y="475" fill="url(#accent)" font-size="12" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="600">30 lines · $14,168 spend · $1,868 savings identified</text>
  </g>
</svg>
